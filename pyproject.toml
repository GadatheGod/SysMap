[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmap"
version = "0.1.0"
description = "Complete system profiler - captures all hardware/software info and generates beautiful reports"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9.0",
    "py-cpuinfo>=9.0.0",
    "pynvml>=11.5.0",
    "pyudev>=0.24.1",
    "pillow>=10.0.0",
    "jinja2>=3.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "screeninfo>=0.8.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61.0"]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
sysmap = "sysmap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sysmap*"]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
